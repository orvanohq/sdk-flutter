name: orvano_flutter
description: >-
  Flutter SDK for Orvano, the self hostable backend. Opens the Orvano client
  for your Flutter app; it includes everything in the orvano package.
version: 0.1.0
repository: https://github.com/orvanohq/sdk-flutter/tree/main/packages/orvano_flutter
issue_tracker: https://github.com/orvanohq/sdk-flutter/issues
topics: [backend, database, auth, realtime, baas]
resolution: workspace

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  # Spec 0004 PKG-4: the same minor version, released together.
  orvano: ">=0.1.0 <0.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
