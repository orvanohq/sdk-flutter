name: orvano
description: >-
  Dart client for Orvano, the self hostable backend. Auth, databases, storage,
  and realtime for Dart and Flutter apps.
version: 0.1.0
repository: https://github.com/orvanohq/sdk-flutter/tree/main/packages/orvano
issue_tracker: https://github.com/orvanohq/sdk-flutter/issues
topics: [backend, database, auth, realtime, baas]
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  clock: ^1.1.0
  collection: ^1.18.0
  http: ^1.5.0
  logging: ^1.2.0
  meta: ^1.15.0

dev_dependencies:
  fake_async: ^1.3.0
  # Not used directly: it sets the floor `pub downgrade` resolves for test,
  # since 3.x looks for a frontend server snapshot newer SDKs no longer ship.
  frontend_server_client: ^4.0.0
  lints: ^6.0.0
  test: ^1.27.0
